plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '1.3.72'
}

group 'org.example'
version '1.0-SNAPSHOT'

sourceCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    testCompile group: 'junit', name: 'junit', version: '4.12'

    compile fileTree(dir: 'libs', include: '*.jar')

    // https://mvnrepository.com/artifact/org.apache.camel/camel-core
    compile group: 'org.apache.camel', name: 'camel-core', version: '2.15.3'

    // https://mvnrepository.com/artifact/com.typesafe.akka/akka-actor
    compile group: 'com.typesafe.akka', name: 'akka-actor_2.11', version: '+'

    compile group: 'org.springframework', name: 'spring-beans', version: '3.2.14.RELEASE'

    // https://mvnrepository.com/artifact/org.antlr/antlr4-runtime
    compile group: 'org.antlr', name: 'antlr4-runtime', version: '4.0'

    // https://mvnrepository.com/artifact/org.jgrapht/
    compile "org.jgrapht:jgrapht-core:+"
    compile group: 'org.jgrapht', name: 'jgrapht-ext', version: '1.3.1'

    // https://mvnrepository.com/artifact/org.freemarker/freemarker
    compile group: 'org.freemarker', name: 'freemarker', version: '2.3.28'

    compile 'fr.inria.gforge.spoon:spoon-core:7.5.0'

    //testImplementation("org.junit.jupiter:junit-jupiter-engine:5.7.0")
    //testImplementation("org.junit.jupiter:junit-jupiter-migrationsupport:5.7.0")
    // Use JUnit Jupiter Engine for testing.
    //testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.5.1'
    //implementation 'org.junit.jupiter:junit-jupiter'

    // JAX-B dependencies for JDK 9+
    implementation "jakarta.xml.bind:jakarta.xml.bind-api:2.3.2"
    implementation "org.glassfish.jaxb:jaxb-runtime:2.3.2"
}

test {
    useJUnitPlatform()
}

compileKotlin {
    kotlinOptions.jvmTarget = "1.8"
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "1.8"
}