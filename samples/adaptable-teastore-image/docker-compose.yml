version: "3.8"

services:
  registry:
    image: cerberus237/adaptable-teastore-registry
    restart: unless-stopped
    environment:
      HOST_NAME: "registry"

  image:
    build:
      context: .
      dockerfile: Dockerfile.manager
      args:
        SIPHONIX: ${SIPHONIX:-./siphonix-app.jar}
    restart: unless-stopped
    environment:
      PORT: 8080
      HOST_NAME: "image"
      REGISTRY_HOST: "registry"
      TARGET_URL: "http://image:8080/tools.descartes.teastore.image/rest"
      SIPHONIX_CONFIG: "/opt/siphonix/scenarios/${SCENARIO_FILE:-benin-traffic}.yml"
      SIPHONIX_PLUGIN_DIR: "/opt/siphonix/plugins"
      SIPHONIX_PLUGIN_DISCOVERY_MODE: "${SIPHONIX_PLUGIN_DISCOVERY_MODE:-watch-auto}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scenarios:/opt/siphonix/scenarios:ro
      - ./plugins:/opt/siphonix/plugins

  db:
    image: cerberus237/adaptable-teastore-db
    restart: unless-stopped
    ports:
      - "3306:3306"

  persistence:
    image: cerberus237/adaptable-teastore-persistence
    restart: unless-stopped
    environment:
      HOST_NAME: "persistence"
      REGISTRY_HOST: "registry"
      DB_HOST: "db"
      DB_PORT: "3306"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  auth:
    image: cerberus237/adaptable-teastore-auth
    restart: unless-stopped
    environment:
      HOST_NAME: "auth"
      REGISTRY_HOST: "registry"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  webui:
    image: cerberus237/adaptable-teastore-webui
    restart: unless-stopped
    environment:
      HOST_NAME: "webui"
      REGISTRY_HOST: "registry"
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  director:
    image: cerberus237/loadgenerator-director
    depends_on: 
      - loadgenerator
    restart: unless-stopped
    environment:
      - LOAD_PROFILE=$LOAD_PROFILE
      - LUA_SCRIPT=$LUA_SCRIPT
      - OUTPUT_LOG=$OUTPUT_LOG
      - LOAD_GENERATOR_IP=$LOAD_GENERATOR_IP
      - APPLICATION_URL=$APPLICATION_URL

  loadgenerator:
    image: cerberus237/loadgenerator-generator
    restart: unless-stopped


    # depend_on entre webui et loadgenerator sinon redémarrer