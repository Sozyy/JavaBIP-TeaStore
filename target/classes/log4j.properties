# Log4j 1.x config used by slf4j-log4j12 (brought by JavaBIP dependencies)
# Keep framework traces quiet by default.
log4j.rootLogger=WARN, CONSOLE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.target=System.out
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%m%n

# Silence JavaBIP traces - redirect to null appender
log4j.appender.NULL=org.apache.log4j.NullAppender
log4j.logger.org.javabip=OFF, NULL
log4j.additivity.org.javabip=false

# Optional: avoid noisy Akka internals unless they are warnings/errors.
log4j.logger.akka=WARN

